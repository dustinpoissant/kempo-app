<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <script>
    window.kempo = {
      pathToStylesheet: '/modules/kempo-css/dist/kempo.min.css',
      pathsToIcons: ['/icons', '/framework/icons', '/modules/kempo-ui/icons'],
      // Keeps kempo-ui's fixed-position overlays (Toast, Dialog, PhotoViewer) out of the
      // titlebar — app-page marks itself as this mount point (see AppPage.js) and
      // establishes the containing block for them via `contain: layout` in app.css.
      // Resolved lazily on first use, so it's safe to set before app-page even exists.
      overlayRoot: '[data-overlay-root]'
    };
  </script>
  <link rel="stylesheet" href="/modules/kempo-css/dist/kempo.min.css">
  <link rel="stylesheet" href="/framework/src/renderer/app.css">
  <link rel="stylesheet" href="/theme.css" onerror="this.remove()">
</head>
<body>
  <script type="module" src="/framework/src/renderer/app.js"></script>
</body>
</html>
